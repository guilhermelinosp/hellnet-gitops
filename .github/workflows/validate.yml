name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render and validate every app
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          for dir in apps/*/; do
            echo "::group::${dir}"
            kubectl kustomize "${dir}" | ./kubeconform -strict -ignore-missing-schemas -summary -
            echo "::endgroup::"
          done
