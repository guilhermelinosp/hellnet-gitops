apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fast
resources: [deployment.yaml]
components: [../../components/hardened]
labels:
  - pairs: {app.kubernetes.io/name: hellnet-service, app.kubernetes.io/instance: fast-listeners}
    includeSelectors: true
images:
  - name: ghcr.io/guilhermelinosp/fast-listeners
    newTag: v1.2.3
configMapGenerator:
  - name: fast-listeners
    literals:
      - HELLNET_ENVIRONMENT=Development
      - HELLNET_TELEMETRY_ENDPOINT=http://alloy.observability.svc.cluster.local:4318
      - DATABASE_HOST=postgres.tools.svc.cluster.local
      - DATABASE_PORT=5432
      - DATABASE_NAME=fast
      - DATABASE_POOL_MAX_SIZE=10
      - KAFKA_BROKERS=redpanda.tools.svc.cluster.local:9093
      - KAFKA_SECURITY_PROTOCOL=plaintext
      - KAFKA_TOPIC_ORDER_REQUESTED=br.com.hellnet.fast.order.requested.v1
      - KAFKA_TOPIC_ORDER_ACCEPTED=br.com.hellnet.fast.order.accepted.v1
      - KAFKA_MATCHING_CONSUMER_GROUP=fast-matching
      - CACHE_CONNECTION=redis.tools.svc.cluster.local:6379
      - CACHE_ENABLE_L2=true
      - CACHE_DEFAULT_TTL=5m
