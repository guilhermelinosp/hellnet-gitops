# Servico Socket.IO (fast-sockets): consome os eventos do Kafka e os entrega por WebSocket.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fast
resources: [deployment.yaml, service.yaml]
components: [../../components/hardened]
labels:
  - pairs: {app.kubernetes.io/name: hellnet-service, app.kubernetes.io/instance: fast-sockets}
    includeSelectors: true
images:
  - name: ghcr.io/guilhermelinosp/fast-sockets
    newTag: v1.1.4
configMapGenerator:
  - name: fast-sockets
    literals:
      - HELLNET_ENVIRONMENT=Development
      - HELLNET_PORT=8080
      - HELLNET_TELEMETRY_ENDPOINT=http://alloy.observability.svc.cluster.local:4318
      - KAFKA_BROKERS=redpanda.tools.svc.cluster.local:9093
      - KAFKA_SECURITY_PROTOCOL=plaintext
      - KAFKA_TOPIC_ORDER_REQUESTED=br.com.hellnet.fast.order.requested.v1
      - KAFKA_TOPIC_ORDER_ACCEPTED=br.com.hellnet.fast.order.accepted.v1
      - SOCKET_DRIVERS_NAMESPACE=/drivers
      - SOCKET_RIDERS_NAMESPACE=/riders
