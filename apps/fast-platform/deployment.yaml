apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-platform
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: fast-platform
          image: ghcr.io/guilhermelinosp/fast-platform
          envFrom:
            - configMapRef: {name: fast-platform}
          env:
            - {name: HELLNET_SERVICE, value: fast-platform}
            - name: DATABASE_USERNAME
              valueFrom: {secretKeyRef: {name: fast-database, key: DATABASE_USERNAME}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: fast-database, key: DATABASE_PASSWORD}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            # 2 CPUs: com 1 o throttling chegou a 6,9% dos periodos sob carga (k6, ~117 req/s); o no tem 20 threads
            limits: {cpu: "2", memory: 512Mi}
