# Aplicado uma unica vez (kubectl apply -f bootstrap/applicationset.yaml): cria uma Application por pasta de apps/.
# Servico novo = pasta nova em apps/ com um kustomization.yaml. Sincronizacao MANUAL (sem `automated`):
# nada muda no cluster ate voce rodar `argocd app sync <nome>`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/guilhermelinosp/hellnet-gitops
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        link.argocd.argoproj.io/GitHub: 'https://github.com/guilhermelinosp/{{.path.basename}}'
        # commit status no GitHub (ver ~/.talos/cluster/argocd/notifications.yaml)
        notifications.argoproj.io/subscribe.on-sync-running.github: ""
        notifications.argoproj.io/subscribe.on-deployed.github: ""
        notifications.argoproj.io/subscribe.on-sync-failed.github: ""
        notifications.argoproj.io/subscribe.on-health-degraded.github: ""
    spec:
      project: default
      source:
        repoURL: https://github.com/guilhermelinosp/hellnet-gitops
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: fast
      syncPolicy:
        syncOptions: [CreateNamespace=true]
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
